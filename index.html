<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Genius — AI Creation Studio</title>
<meta name="description" content="Generate AI images and videos right in your browser. Pick a mini app, add a prompt or photo, get your result. Free during alpha; Genius Pro for unlimited." />
<!--
  GENIUS WEB — Pixverse-pattern AI portal (M0 prototype).
  Logic mirrors app.pixverse.ai: Home feed → pick a Mini App → input → generate
  → async job → result lands in Gallery.

  MONETIZATION: Genius sells a SUBSCRIPTION (Genius Pro) only. There are NO credits
  anywhere in the product. At M0 generation is FREE for everyone; Pro is shown as an
  upsell (no gating yet). Later, Free tier gets soft limits (watermark / standard
  quality) and Pro removes them — but never a credit balance.

  SCOPE NOTE (M0): generation wiring lives in callBackend() below. It calls the
  server-signed web API (POST /api/v1/web/execute → poll GET /api/v1/web/:runId/status):
  the browser sends only x-api-bundleid + x-api-email, BE signs server-side. Gated
  behind CONFIG.useRealBackend; with it false (or a service's workflowId missing, or no
  bundleId set) the call falls back to a local mock so the file runs offline.
  WIRED: t2i → fal seedream/v4.5/text-to-image (workflowId 3e01896a-…). Needs a
  whitelisted CONFIG.bundleId to run for real.
  Auth = mock (→ Firebase), wallet = mock/localStorage, Pro = mock (→ Stripe sub at M1).
-->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --sidebar:#0B0A0F; --card:#15131D; --card-2:#1E1C28; --surface-3:#382D4A;
    --hairline:rgba(255,255,255,.08);
    --tx:#FFF; --tx2:#A3AEC7; --tx3:#6B7280;
    --primary:#9B4DFF; --primary-2:#7A2BF6;
    --grad:linear-gradient(135deg,#B14DFF 0%,#7A2BF6 100%);
    --glow:0 8px 32px rgba(123,47,247,.45);
    --ok:#3DD68C; --warn:#FFC83D; --err:#FF5C7A;
    --r:14px; --r-lg:20px; --pill:999px;
    --font:"Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --sbw:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:inherit;text-decoration:none}
  img,video{display:block}
  button{font-family:inherit}
  ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#2a2730;border-radius:8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;border:none;padding:11px 20px;border-radius:var(--pill);transition:transform .15s,box-shadow .2s,background .2s,opacity .2s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
  .btn-primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 12px 40px rgba(123,47,247,.6)}
  .btn-ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--hairline)}
  .btn-ghost:hover{background:rgba(255,255,255,.13)}
  .btn-sm{padding:8px 15px;font-size:13px}
  .btn-block{width:100%}
  .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .credit-pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:7px 13px;border-radius:var(--pill);background:rgba(155,77,255,.16);border:1px solid rgba(155,77,255,.35);color:#E9D5FF}
  .credit-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary)}

  /* ===== Layout shell ===== */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sbw);flex:none;background:var(--sidebar);border-right:1px solid var(--hairline);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
  .main{flex:1;min-width:0;padding:22px 30px 70px}

  /* ===== Sidebar ===== */
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.5px;padding:6px 8px 18px}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:17px;box-shadow:var(--glow)}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:600;font-size:14.5px;transition:.15s;cursor:pointer}
  .nav a:hover{background:rgba(255,255,255,.05);color:#fff}
  .nav a.active{background:linear-gradient(90deg,rgba(155,77,255,.22),rgba(155,77,255,.06));color:#fff;border:1px solid rgba(155,77,255,.35)}
  .nav a.active .ico{stroke:var(--primary)}
  .nav a .badge{margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:var(--pill);background:rgba(255,255,255,.1);color:var(--tx2)}

  .wallet-card{margin-top:14px;background:var(--card);border:1px solid rgba(155,77,255,.3);border-radius:var(--r-lg);padding:15px;position:relative;overflow:hidden}
  .wallet-card::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0,rgba(155,77,255,.22),transparent 70%)}
  .wallet-card>*{position:relative}
  .wallet-card .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
  .wallet-card .bal{font-size:26px;font-weight:900;margin:2px 0 12px;display:flex;align-items:center;gap:7px}
  .wallet-card .bal .spark{font-size:18px}

  .me{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 8px;border-radius:12px;cursor:pointer}
  .me:hover{background:rgba(255,255,255,.05)}
  .me .av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .me .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .tier{font-size:10px;font-weight:700;color:var(--tx2)}

  /* ===== Top bar ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
  .topbar h1{font-size:25px;font-weight:900;letter-spacing:-.5px}
  .topbar .sub{color:var(--tx2);font-size:14px;margin-top:3px;font-weight:500}
  .top-right{display:flex;align-items:center;gap:10px}

  /* ===== Prompt bar (home) ===== */
  .prompt-bar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--hairline);border-radius:var(--pill);padding:8px 8px 8px 20px;margin-bottom:30px;transition:border-color .2s}
  .prompt-bar:focus-within{border-color:rgba(155,77,255,.6)}
  .prompt-bar input{flex:1;background:none;border:none;color:#fff;font-size:15px;font-family:inherit;outline:none}
  .prompt-bar input::placeholder{color:var(--tx3)}

  /* ===== Hero ===== */
  .hero{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:260px;display:flex;align-items:center;margin-bottom:36px;border:1px solid var(--hairline);background:var(--card-2)}
  .hero video,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,6,14,.96) 0%,rgba(8,6,14,.8) 40%,rgba(8,6,14,.2) 75%)}
  .hero .inner{position:relative;padding:40px 44px;max-width:560px}
  .pill-tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:var(--pill);color:#E9D5FF;background:rgba(155,77,255,.18);border:1px solid rgba(155,77,255,.35);margin-bottom:16px}
  .hero h2{font-size:clamp(28px,3.2vw,40px);font-weight:900;line-height:1.08;letter-spacing:-1.5px;margin-bottom:13px}
  .hero h2 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--tx2);font-size:15.5px;max-width:42ch;margin-bottom:22px}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}

  /* ===== Section heads & grids ===== */
  .row-head{display:flex;align-items:center;justify-content:space-between;margin:34px 0 16px}
  .row-head h3{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;letter-spacing:-.5px}
  .row-head .see{color:var(--tx2);font-size:13.5px;font-weight:700;cursor:pointer}
  .row-head .see:hover{color:var(--primary)}

  .feed{columns:4;column-gap:16px}
  @media(max-width:1300px){.feed{columns:3}}
  @media(max-width:980px){.feed{columns:2}}
  .feed .tile{break-inside:avoid;margin-bottom:16px;position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--card-2);border:1px solid var(--hairline);transition:transform .2s,border-color .2s,box-shadow .2s}
  .feed .tile:hover{transform:translateY(-3px);border-color:rgba(155,77,255,.6);box-shadow:var(--glow)}
  .feed .tile video,.feed .tile img{width:100%;height:auto}
  .feed .tile .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 45%)}
  .feed .tile .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 13px}
  .feed .tile .cap{font-size:13.5px;font-weight:700;margin-bottom:5px}
  .feed .tile .svc{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);font-weight:600}
  .feed .tile .kbadge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--pill);background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;border:1px solid var(--hairline)}

  /* ===== Mini Apps catalog ===== */
  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .app-card{position:relative;border-radius:var(--r-lg);overflow:hidden;cursor:pointer;border:1px solid var(--hairline);background:var(--card-2);transition:transform .2s,border-color .2s,box-shadow .2s}
  .app-card:hover{transform:translateY(-4px);border-color:rgba(155,77,255,.6);box-shadow:var(--glow)}
  .app-card .thumb{aspect-ratio:16/10;position:relative;background:var(--surface-3)}
  .app-card .thumb video,.app-card .thumb img{width:100%;height:100%;object-fit:cover}
  .app-card .thumb .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%)}
  .app-card .body{padding:14px 16px 16px}
  .app-card .body h4{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .app-card .body p{color:var(--tx2);font-size:13px;margin:5px 0 12px;min-height:34px}
  .app-card .foot{display:flex;align-items:center;justify-content:space-between}
  .modality{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:var(--pill);background:rgba(255,255,255,.08);color:var(--tx2)}
  .cost{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:#E9D5FF}
  /* coming-soon (non-M0 services) */
  .app-card.soon{opacity:.6;cursor:default}
  .app-card.soon:hover{transform:none;border-color:var(--hairline);box-shadow:none}
  .app-card.soon .thumb{filter:grayscale(.6)}
  .soon-badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:var(--pill);background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border:1px solid var(--hairline);color:#fff}
  .cost.soon-tag{color:var(--tx3)}

  /* ===== Service page ===== */
  .svc-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
  @media(max-width:980px){.svc-wrap{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px}
  .panel h4{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:7px}
  textarea,.upload{width:100%;background:var(--bg);border:1px solid var(--hairline);border-radius:var(--r);color:#fff;font-family:inherit;font-size:14px;padding:13px 14px;outline:none;transition:border-color .2s}
  textarea{resize:vertical;min-height:96px}
  textarea:focus,.upload:focus-within{border-color:rgba(155,77,255,.6)}
  .upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;cursor:pointer;color:var(--tx2);text-align:center;border-style:dashed}
  .upload:hover{color:#fff;border-color:rgba(155,77,255,.6)}
  .upload img{max-height:180px;width:auto;border-radius:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip-opt{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:var(--pill);border:1px solid var(--hairline);background:rgba(255,255,255,.04);color:var(--tx2);cursor:pointer;transition:.15s}
  .chip-opt:hover{color:#fff}
  .chip-opt.sel{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
  .runbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding-top:16px;border-top:1px solid var(--hairline)}
  .runbar .costnote{font-size:13px;color:var(--tx2);font-weight:600}
  .runbar .costnote b{color:#E9D5FF}

  /* output canvas */
  .out{position:relative;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--card-2);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;text-align:center}
  .out.video{aspect-ratio:9/16;max-height:480px;margin:0 auto}
  .out video,.out img{width:100%;height:100%;object-fit:cover}
  .out .placeholder{color:var(--tx3);padding:24px}
  .out .placeholder .ico{width:40px;height:40px;margin:0 auto 12px;stroke:var(--tx3)}
  .job{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--tx2)}
  .spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--primary);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .job .status{font-weight:700;font-size:14px;color:#fff}
  .job .sub{font-size:12.5px}
  .out-actions{display:flex;gap:10px;margin-top:14px}

  /* recent strip */
  .recent{display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:12px;overflow-x:auto;padding-bottom:6px}
  .recent .r{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--hairline);background:var(--card-2)}
  .recent .r video,.recent .r img{width:100%;height:100%;object-fit:cover}

  /* ===== Gallery ===== */
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .gal{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card-2);border:1px solid var(--hairline);aspect-ratio:1/1}
  .gal video,.gal img{width:100%;height:100%;object-fit:cover}
  .gal .st{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:var(--pill);display:flex;align-items:center;gap:5px}
  .gal .st.processing{background:rgba(255,200,61,.18);color:var(--warn);border:1px solid rgba(255,200,61,.4)}
  .gal .st.success{background:rgba(61,214,140,.16);color:var(--ok);border:1px solid rgba(61,214,140,.4)}
  .gal .st.failed{background:rgba(255,92,122,.16);color:var(--err);border:1px solid rgba(255,92,122,.4)}
  .gal .st .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .gal .gmeta{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);font-size:12px;font-weight:600}
  .gal .proc-fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}

  /* ===== Wallet ===== */
  .packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:30px}
  .pack{position:relative;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px 18px;background:var(--card);cursor:pointer;transition:.15s;text-align:center}
  .pack:hover{border-color:rgba(155,77,255,.6);transform:translateY(-3px)}
  .pack.featured{border-color:var(--primary);box-shadow:var(--glow)}
  .pack .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 12px;border-radius:var(--pill);background:var(--grad);color:#fff}
  .pack .cr{font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:7px}
  .pack .cr .spark{font-size:20px}
  .pack .nm{font-size:13px;font-weight:700;color:var(--tx2);margin:2px 0 14px}
  .pack .price{font-size:18px;font-weight:900;margin-bottom:14px}
  .pack .price small{font-size:11px;color:var(--tx3);font-weight:600;display:block;margin-top:2px}
  .txns{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden}
  .txn{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--hairline);font-size:14px}
  .txn:last-child{border-bottom:none}
  .txn .ti{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06)}
  .txn .td{flex:1}
  .txn .td .t{font-weight:700}
  .txn .td .d{font-size:12px;color:var(--tx3)}
  .txn .amt{font-weight:800}
  .txn .amt.plus{color:var(--ok)}.txn .amt.minus{color:var(--tx2)}

  /* ===== Earn ===== */
  .earn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .earn{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px}
  .earn .ehead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:8px}
  .earn .ehead .ei{width:36px;height:36px;border-radius:10px;background:rgba(155,77,255,.16);display:grid;place-items:center}
  .earn p{color:var(--tx2);font-size:13px;margin-bottom:14px}
  .ref-link{display:flex;gap:8px;margin-bottom:14px}
  .ref-link input{flex:1;background:var(--bg);border:1px solid var(--hairline);border-radius:10px;color:var(--tx2);font-size:12.5px;padding:9px 12px;outline:none}

  /* ===== Modal ===== */
  .scrim-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:30px;max-width:400px;width:100%;text-align:center;position:relative}
  .modal .mclose{position:absolute;top:14px;right:14px;cursor:pointer;color:var(--tx3)}
  .modal .mmark{width:54px;height:54px;border-radius:15px;background:var(--grad);display:grid;place-items:center;font-size:28px;margin:0 auto 16px;box-shadow:var(--glow)}
  .modal h3{font-size:21px;font-weight:900;margin-bottom:6px}
  .modal p{color:var(--tx2);font-size:14px;margin-bottom:20px}
  .auth-btns{display:flex;flex-direction:column;gap:10px}
  .auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--hairline);background:rgba(255,255,255,.05);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
  .auth-btn:hover{background:rgba(255,255,255,.12)}

  /* ===== Toast ===== */
  .toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
  .toast{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1px solid var(--hairline);border-radius:14px;padding:13px 16px;min-width:280px;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:slidein .3s ease}
  @keyframes slidein{from{transform:translateX(40px);opacity:0}}
  .toast .tibox{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .toast.ok .tibox{background:rgba(61,214,140,.16);color:var(--ok)}
  .toast.info .tibox{background:rgba(155,77,255,.16);color:var(--primary)}
  .toast.err .tibox{background:rgba(255,92,122,.16);color:var(--err)}
  .toast .ttxt .tt{font-weight:800;font-size:13.5px}
  .toast .ttxt .ts{font-size:12px;color:var(--tx2)}

  .empty{text-align:center;padding:70px 20px;color:var(--tx3)}
  .empty .ico{width:46px;height:46px;margin:0 auto 14px;stroke:var(--tx3)}
  .empty h4{color:var(--tx2);font-size:16px;font-weight:700;margin-bottom:6px}

/* =====================================================================
   BACKEND CALL — server-signed web API (the ONE place real wiring lives).
   Each mini-app maps to a workflowId (config.workflows[service.id]). Flow:
     1) POST /api/v1/web/execute  { workflowId, input }   -> { runId, jobId, status }
     2) poll GET /api/v1/web/:runId/status  every ~4s     -> until completed/failed/cancelled
   Web client only sends x-api-bundleid + x-api-email; BE signs & forwards.
   Falls back to a local mock when useRealBackend=false or the service has no
   workflowId yet — so the catalog still demos offline.
   ===================================================================== */
async function callBackend(service, input, onStatus){
  const workflowId = BE.workflows[service.id];
  // Fall back to the local mock unless real backend is on AND this service has a
  // workflowId AND a whitelisted bundleId is set. (bundleId pending from BE.)
  if(!USE_REAL_BACKEND || !workflowId || !BE.bundleId) return mockBackend(service, input, onStatus);
  const email = S.user && S.user.email;
  if(!email)                  return { ok:false, error:"Please sign in first." };

  const idHeaders = { "x-api-bundleid": BE.bundleId, "x-api-email": email };

  // 1) Execute — create the job.
  onStatus("queued","Queued — finding a GPU…");
  let runId;
  try{
    const r = await fetch(`${BE.base}/api/v1/web/execute`, {
      method:"POST",
      headers:{ ...idHeaders, "Content-Type":"application/json" },
      body: JSON.stringify({ workflowId, input: buildInput(service, input) }),
    });
    const env = await r.json().catch(()=>({}));
    if(!r.ok) return { ok:false, error: env.message || `Execute failed (HTTP ${r.status}).` };
    runId = (env.data||{}).runId;
    if(!runId) return { ok:false, error:"Backend returned no runId." };
  }catch(e){ return { ok:false, error:"Network error: "+((e&&e.message)||e) }; }

  // 2) Poll status until terminal (completed / failed / cancelled).
  onStatus("running", service.async ? "Rendering video…" : "Generating…");
  const POLL_MS=4000, TIMEOUT_MS=(service.async?5*60:90)*1000, t0=performance.now();
  while(true){
    await wait(POLL_MS);
    try{
      const r = await fetch(`${BE.base}/api/v1/web/${encodeURIComponent(runId)}/status`, { headers:idHeaders });
      const env = await r.json().catch(()=>({}));
      if(r.ok){
        const d = env.data || {};
        if(d.status==="completed")                        return { ok:true,  output: parseOutput(service, d.output), runId, raw:d };
        if(d.status==="failed" || d.status==="cancelled") return { ok:false, error: d.error || `Generation ${d.status}.`, runId };
        // pending / processing → keep polling
      } else if(r.status!==404){   // a 404 right after execute can be a DB-write race; tolerate until timeout
        return { ok:false, error: env.message || `Status check failed (HTTP ${r.status}).`, runId };
      }
    }catch(e){ /* transient network blip — keep polling until timeout */ }
    if(performance.now()-t0 > TIMEOUT_MS) return { ok:false, error:"Timed out waiting for the result.", runId };
  }
}

/* MOCK PATH — offline behaviour when useRealBackend=false or workflowId missing. */
async function mockBackend(service, input, onStatus){
  await wait(500); onStatus("queued","Queued — finding a GPU…");
  await wait(900); onStatus("running", service.async ? "Rendering video…" : "Generating…");
  await wait(service.async ? 2600 : 1500);
  if(Math.random()<0.06) return { ok:false, error:"Engine timeout. Please try again." };
  return { ok:true, output: mockOutput(service, input) };
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
function mockOutput(service, input){
  // Reuse bundled assets so the prototype renders something real offline.
  if(service.modality.includes("Video")) return { type:"video", src: Math.random()<.5?"assets/wc.mp4":"assets/kid2.mp4" };
  const imgs=["assets/brazil.png","assets/japan.png","assets/netherlands.png"];
  return { type:"img", src: input.image || imgs[Math.floor(Math.random()*imgs.length)] };
}

/* Map the app's collected input → the workflow service input schema.
   `input` is forwarded verbatim by BE, so field names are WORKFLOW-SPECIFIC.
   Confirm each schema with BE per workflowId and add an override below as IDs arrive.
   ⚠ image inputs: CURRENT_INPUT.image is a local objectURL (URL.createObjectURL),
     which is NOT reachable by the server — i2i/i2v services need a real upload/host
     step (BE to advise) before their workflow can consume the image. */
function buildInput(service, raw){
  const PER_SERVICE = {
    // fal seedream/v4.5/text-to-image. `style` is a UI chip → fold into the prompt
    // (the workflow has no style field; it's forwarded verbatim so unknown keys are ignored anyway).
    t2i: () => ({
      prompt: raw.style && raw.style!=="Photoreal" ? `${raw.prompt}, ${raw.style} style` : raw.prompt,
      imageSize: "square_hd",
      numImages: 1,
      max_images: 1,
      seed: 0,
      syncMode: false,
      enableSafetyChecker: true,
    }),
    // i2v:             () => ({ positivePrompt: raw.prompt, image: raw.image, ratio:"16:9", resolution:"720p", duration:5, outputSound:false }),
    // "i2i-restyle":   () => ({ image: raw.image, style: raw.style }),
    // headshot:        () => ({ image: raw.image, style: raw.style }),
    // restore:         () => ({ image: raw.image }),
    // "living-portrait": () => ({ image: raw.image, positivePrompt: raw.prompt }),
    // jersey:          () => ({ image: raw.image, style: raw.style }),
    // makeup:          () => ({ image: raw.image, style: raw.style }),
  };
  if(PER_SERVICE[service.id]) return PER_SERVICE[service.id]();
  // Generic fallback: forward whatever we collected under best-guess keys.
  const out = {};
  if(raw.prompt) out.positivePrompt = raw.prompt;
  if(raw.style)  out.style = raw.style;
  if(raw.image)  out.image = raw.image;
  return out;
}

/* Map the workflow `output` object → the app's media shape {type, src}. */
function parseOutput(service, output){
  const o = output || {}, isVideo = service.modality.includes("Video");
  const src = o.resultFile        // seedream/v4.5/text-to-image (and other fal workflows)
    || o.videoUrl || o.imageUrl || o.url
    || (Array.isArray(o.images) && (o.images[0] && (o.images[0].url || o.images[0])))
    || (Array.isArray(o.output) && o.output[0])
    || (o.data && (o.data.resultFile || o.data.videoUrl || o.data.imageUrl || o.data.url))
    || "";
  return src ? { type:isVideo?"video":"img", src } : mockOutput(service, {});
}

/* OPTIONAL — server-backed job list (GET /api/v1/web/jobs). Use to hydrate the
   Gallery from the backend instead of localStorage. Returns { items,total,page,limit }
   or null. Note: cached ~120s server-side, sorted newest-first. */
async function fetchJobs(page=1, limit=20){
  if(!USE_REAL_BACKEND || !(S.user && S.user.email)) return null;
  try{
    const r = await fetch(`${BE.base}/api/v1/web/jobs?page=${page}&limit=${limit}`, { headers:{ "x-api-email": S.user.email } });
    const env = await r.json().catch(()=>({}));
    return r.ok ? (env.data || null) : null;
  }catch(e){ return null; }
}

/* ---------- Generation orchestration ---------- */
function startGeneration(service, input){
  if(!requireAuth(()=>startGeneration(service,input))) return;
  // M0: generation is FREE for everyone — no credits, no gating. (Free-tier soft
  // limits / Pro perks come later; the upsell never blocks creation here.)
  const item={ id:uid(), svc:service.id, status:"processing", prompt:input.prompt||"", input, output:null, ts:Date.now() };
  S.gallery.unshift(item); save();
  toast("info", service.async?"Job queued":"Generating…", service.async?"We'll notify you when it's ready.":"");

  // Update the live service-page output if we're on it
  const onPage = ()=> location.hash===("#/app/"+service.id);
  callBackend(service, input, (st,label)=>{
    item.status = st==="queued"||st==="running" ? "processing" : item.status;
    if(onPage) renderJobState(label);
  }).then(res=>{
    if(res.ok){ item.status="success"; item.output=res.output; toast("ok","Your creation is ready ✦", service.name); }
    else{ item.status="failed"; toast("err","Generation failed", res.error); }
    save();
    if(onPage) render(); else syncChrome();
  });
}
function renderJobState(label){
  const out=$("#svc-out"); if(!out) return;
  out.innerHTML = `<div class="job"><div class="spinner"></div><div class="status">${esc(label)}</div><div class="sub">Result will be saved to your Gallery</div></div>`;
}

}
