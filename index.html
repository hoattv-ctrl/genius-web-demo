<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Genius — AI Creation Studio</title>
<meta name="description" content="Generate AI images and videos right in your browser. Pick a mini app, add a prompt or photo, get your result. Free to start. Genius Pro for unlimited HD, no watermark." />
<!--
  GENIUS WEB — Pixverse-pattern AI portal (M0 prototype).
  Logic mirrors app.pixverse.ai: Home feed → pick a Mini App → input → generate
  → async job → result lands in Gallery.

  MONETIZATION: Genius sells a SUBSCRIPTION (Genius Pro) only. There are NO credits
  anywhere in the product. At M0 generation is FREE for everyone; Pro is shown as an
  upsell (no gating yet). Later, Free tier gets soft limits (watermark / standard
  quality) and Pro removes them — but never a credit balance.

  SCOPE NOTE (M0): generation wiring lives in callBackend() below. It calls the
  server-signed web API (POST /api/v1/web/execute → poll GET /api/v1/web/:runId/status):
  the browser sends only x-api-bundleid + x-api-email, BE signs server-side. Gated
  behind CONFIG.useRealBackend; with it false (or a service's workflowId missing, or no
  bundleId set) the call falls back to a local mock so the file runs offline.
  WIRED: t2i → fal seedream/v4.5/text-to-image (workflowId 3e01896a-…). Needs a
  whitelisted CONFIG.bundleId to run for real.
  Auth = mock (→ Firebase), wallet = mock/localStorage, Pro = mock (→ Stripe sub at M1).
-->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
<style>
  :root{
    /* ===== Dark theme — Google AI Studio inspired ===== */
    --bg:#131314; --sidebar:#1b1c1d; --card:#1e1f20; --card-2:#26282a; --surface-3:#2f3133;
    --hairline:rgba(255,255,255,.10);
    --tx:#e8eaed; --tx2:#9aa0a6; --tx3:#6e7681;
    --surf2:#26282a;
    --primary:#b794f6; --primary-2:#a37bf2;
    --grad:linear-gradient(135deg,#B14DFF 0%,#7A2BF6 100%);
    --glow:none;
    --shadow-hover:0 1px 0 rgba(255,255,255,.04);
    --tint:rgba(183,148,246,.14);
    --tint-2:rgba(183,148,246,.30);
    --ok:#5bd6a0; --warn:#f5c451; --err:#f2849e;
    --r:12px; --r-lg:16px; --pill:999px;
    --font:"Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --sbw:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit;text-decoration:none}
  img,video{display:block}
  button{font-family:inherit}
  ::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#3a3c3f;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#4a4d50}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;border:none;padding:9px 18px;border-radius:var(--pill);transition:background .15s,border-color .15s,opacity .15s;letter-spacing:-.1px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--primary);color:#1a1024}
  .btn-primary:not(:disabled):hover{background:var(--primary-2)}
  .btn-ghost{background:transparent;color:var(--tx);border:1px solid var(--hairline)}
  .btn-ghost:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2)}
  .btn-sm{padding:7px 14px;font-size:13px}
  .btn-block{width:100%}
  .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .credit-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:6px 12px;border-radius:var(--pill);background:var(--tint);border:1px solid var(--tint-2);color:#d8c4ff}
  .credit-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}

  /* ===== Layout shell ===== */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sbw);flex:none;background:var(--sidebar);border-right:1px solid var(--hairline);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
  .main{flex:1;min-width:0;padding:28px 40px 80px;max-width:1280px;margin:0 auto;width:100%}

  /* ===== Sidebar ===== */
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.4px;padding:6px 10px 20px;color:var(--tx)}
  .brand .mark{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:none}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav-lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);padding:18px 12px 6px}
  .nav a{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:10px;color:var(--tx2);font-weight:500;font-size:14px;transition:.12s;cursor:pointer}
  .nav a:hover{background:rgba(255,255,255,.05);color:var(--tx)}
  .nav a.active{background:var(--tint);color:#d8c4ff;font-weight:600}
  .nav a.active .ico{stroke:var(--primary)}
  .nav a .badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--pill);background:rgba(255,255,255,.08);color:var(--tx2)}

  .wallet-card{margin-top:auto;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:15px;position:relative;overflow:hidden}
  .wallet-card::before{content:none}
  .wallet-card>*{position:relative}
  .wallet-card .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
  .wallet-card .bal{font-size:22px;font-weight:700;margin:2px 0 12px;display:flex;align-items:center;gap:7px;color:var(--tx)}
  .wallet-card .bal .spark{font-size:18px}

  .me{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px;border-radius:10px;cursor:pointer}
  .me:hover{background:rgba(255,255,255,.05)}
  .me .av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
  .me .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
  .me .tier{font-size:11px;font-weight:500;color:var(--tx2)}

  /* ===== Top bar ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px}
  .topbar h1{font-size:24px;font-weight:700;letter-spacing:-.6px;color:var(--tx)}
  .topbar .sub{color:var(--tx2);font-size:14px;margin-top:3px;font-weight:400}
  .top-right{display:flex;align-items:center;gap:10px}

  /* ===== Explore header (AI Studio style) ===== */
  .explore-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 26px}
  .explore-head h2{font-size:30px;font-weight:500;letter-spacing:-.8px;color:var(--tx)}
  .seg{display:inline-flex;background:var(--card-2);border:1px solid var(--hairline);border-radius:var(--pill);padding:3px}
  .seg span{font-size:13px;font-weight:600;padding:6px 16px;border-radius:var(--pill);color:var(--tx2);cursor:default}
  .seg span.on{background:var(--surface-3);color:var(--tx)}

  /* ===== Prompt bar (AI Studio bottom bar) ===== */
  .prompt-bar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:10px 10px 10px 18px;margin-bottom:30px;transition:border-color .15s}
  .prompt-bar:focus-within{border-color:var(--tint-2)}
  .prompt-bar input{flex:1;background:none;border:none;color:var(--tx);font-size:15px;font-family:inherit;outline:none}
  .prompt-bar input::placeholder{color:var(--tx3)}

  /* ===== Hero (kept for compat; minimal) ===== */
  .hero{position:relative;border-radius:var(--r-lg);overflow:hidden;display:flex;align-items:center;margin-bottom:30px;border:1px solid var(--hairline);background:var(--card)}
  .hero .scrim{position:absolute;inset:0}
  .hero .inner{position:relative;padding:34px 38px;max-width:620px}
  .pill-tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 13px;border-radius:var(--pill);color:#d8c4ff;background:var(--tint);border:1px solid var(--tint-2);margin-bottom:16px}
  .hero h2{font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.12;letter-spacing:-.8px;margin-bottom:12px;color:var(--tx)}
  .hero h2 .grad{color:var(--primary)}
  .hero p{color:var(--tx2);font-size:15px;max-width:48ch;margin-bottom:22px}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}

  /* ===== Section heads ===== */
  .row-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px}
  .row-head h3{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.3px;color:var(--tx)}
  .row-head .see{color:var(--primary);font-size:13.5px;font-weight:600;cursor:pointer}
  .row-head .see:hover{opacity:.75}

  /* feed kept for compat (unused on home/service now) */
  .feed{columns:4;column-gap:16px}
  @media(max-width:1300px){.feed{columns:3}}
  @media(max-width:980px){.feed{columns:2}}
  .feed .tile{break-inside:avoid;margin-bottom:16px;position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--card-2);border:1px solid var(--hairline)}
  .feed .tile video,.feed .tile img{width:100%;height:auto}
  .feed .tile .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),transparent 48%)}
  .feed .tile .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 13px}
  .feed .tile .cap{font-size:13.5px;font-weight:700;margin-bottom:5px;color:#fff}
  .feed .tile .svc{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.82);font-weight:500}
  .feed .tile .kbadge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--pill);background:rgba(0,0,0,.5);color:#fff}

  /* ===== Feature cards (AI Studio model-card grid: icon + title + desc, NO media) ===== */
  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .app-card{position:relative;border-radius:var(--r-lg);cursor:pointer;border:1px solid var(--hairline);background:var(--card);padding:20px;transition:background .15s,border-color .15s;min-height:150px;display:flex;flex-direction:column}
  .app-card:hover{background:var(--card-2);border-color:rgba(255,255,255,.18)}
  .ac-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--tint);border:1px solid var(--tint-2);margin-bottom:14px}
  .app-card h4{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--tx);margin-bottom:6px}
  .app-card p{color:var(--tx2);font-size:13.5px;line-height:1.5;flex:1}
  .app-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .modality{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--tx3)}
  .cost{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--primary)}

  /* ===== Service page ===== */
  .svc-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
  @media(max-width:980px){.svc-wrap{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px}
  .panel h4{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--tx)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:7px}
  textarea,.upload{width:100%;background:var(--bg);border:1px solid var(--hairline);border-radius:var(--r);color:var(--tx);font-family:inherit;font-size:14px;padding:13px 14px;outline:none;transition:border-color .15s}
  textarea{resize:vertical;min-height:96px}
  textarea:focus,.upload:focus-within{border-color:var(--tint-2)}
  .upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;cursor:pointer;color:var(--tx2);text-align:center;border-style:dashed;background:var(--card-2)}
  .upload:hover{color:var(--tx);border-color:var(--tint-2)}
  .upload img{max-height:180px;width:auto;border-radius:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip-opt{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:var(--pill);border:1px solid var(--hairline);background:var(--card-2);color:var(--tx2);cursor:pointer;transition:.12s}
  .chip-opt:hover{color:var(--tx);border-color:rgba(255,255,255,.2)}
  .chip-opt.sel{background:var(--tint);color:#d8c4ff;border-color:var(--tint-2)}
  .runbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding-top:16px;border-top:1px solid var(--hairline)}
  .runbar .costnote{font-size:13px;color:var(--tx2);font-weight:400}
  .runbar .costnote b{color:var(--primary);font-weight:700}

  /* output canvas */
  .out{position:relative;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--card-2);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;text-align:center}
  .out.video{aspect-ratio:9/16;max-height:480px;margin:0 auto}
  .out video,.out img{width:100%;height:100%;object-fit:cover}
  .out .placeholder{color:var(--tx3);padding:24px;font-size:13.5px}
  .out .placeholder .ico{width:40px;height:40px;margin:0 auto 12px;stroke:var(--tx3)}
  .job{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--tx2)}
  .spinner{width:42px;height:42px;border-radius:50%;border:3px solid var(--hairline);border-top-color:var(--primary);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .job .status{font-weight:700;font-size:14px;color:var(--tx)}
  .job .sub{font-size:12.5px}
  .out-actions{display:flex;gap:10px;margin-top:14px}

  /* recent strip */
  .recent{display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:12px;overflow-x:auto;padding-bottom:6px}
  .recent .r{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--hairline);background:var(--card-2)}
  .recent .r video,.recent .r img{width:100%;height:100%;object-fit:cover}

  /* ===== Gallery ===== */
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .gal{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card-2);border:1px solid var(--hairline);aspect-ratio:1/1}
  .gal video,.gal img{width:100%;height:100%;object-fit:cover}
  .gal .st{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--pill);display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
  .gal .st.processing{background:rgba(245,196,81,.16);color:var(--warn);border:1px solid rgba(245,196,81,.3)}
  .gal .st.success{background:rgba(91,214,160,.16);color:var(--ok);border:1px solid rgba(91,214,160,.3)}
  .gal .st.failed{background:rgba(242,132,158,.16);color:var(--err);border:1px solid rgba(242,132,158,.3)}
  .gal .st .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .gal .gmeta{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(to top,rgba(0,0,0,.82),transparent);font-size:12px;font-weight:600;color:#fff}
  .gal .proc-fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}

  /* ===== Wallet / Plans ===== */
  .packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:30px}
  .pack{position:relative;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:22px 18px 18px;background:var(--card);cursor:pointer;transition:.15s;text-align:center}
  .pack:hover{border-color:rgba(255,255,255,.2);background:var(--card-2)}
  .pack.featured{border-color:var(--tint-2)}
  .pack .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 12px;border-radius:var(--pill);background:var(--primary);color:#1a1024;white-space:nowrap}
  .pack .cr{font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--tx)}
  .pack .cr .spark{font-size:20px}
  .pack .nm{font-size:13px;font-weight:600;color:var(--tx2);margin:2px 0 14px}
  .pack .price{font-size:18px;font-weight:700;margin-bottom:14px;color:var(--tx)}
  .pack .price small{font-size:11px;color:var(--tx3);font-weight:500;display:block;margin-top:2px}
  .txns{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden}
  .txn{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--hairline);font-size:14px}
  .txn:last-child{border-bottom:none}
  .txn .ti{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surf2)}
  .txn .td{flex:1}
  .txn .td .t{font-weight:600;color:var(--tx)}
  .txn .td .d{font-size:12px;color:var(--tx3)}
  .txn .amt{font-weight:700}
  .txn .amt.plus{color:var(--ok)}.txn .amt.minus{color:var(--tx2)}

  /* ===== Earn ===== */
  .earn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .earn{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px}
  .earn .ehead{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:8px;color:var(--tx)}
  .earn .ehead .ei{width:36px;height:36px;border-radius:10px;background:var(--tint);display:grid;place-items:center}
  .earn p{color:var(--tx2);font-size:13px;margin-bottom:14px}
  .ref-link{display:flex;gap:8px;margin-bottom:14px}
  .ref-link input{flex:1;background:var(--bg);border:1px solid var(--hairline);border-radius:10px;color:var(--tx2);font-size:12.5px;padding:9px 12px;outline:none}

  /* ===== Modal ===== */
  .scrim-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:30px;max-width:400px;width:100%;text-align:center;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal .mclose{position:absolute;top:14px;right:14px;cursor:pointer;color:var(--tx3)}
  .modal .mmark{width:54px;height:54px;border-radius:15px;overflow:hidden;display:grid;place-items:center;margin:0 auto 16px}
  .modal .mmark img{width:100%;height:100%;object-fit:cover}
  .modal h3{font-size:21px;font-weight:700;margin-bottom:6px;color:var(--tx)}
  .modal p{color:var(--tx2);font-size:14px;margin-bottom:20px}
  .auth-btns{display:flex;flex-direction:column;gap:10px}
  .auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--hairline);background:var(--card-2);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;transition:.12s}
  .auth-btn:hover{background:var(--surface-3);border-color:rgba(255,255,255,.2)}

  /* ===== Toast ===== */
  .toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
  .toast{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1px solid var(--hairline);border-radius:14px;padding:13px 16px;min-width:280px;max-width:360px;box-shadow:0 12px 36px rgba(0,0,0,.45);animation:slidein .3s ease}
  @keyframes slidein{from{transform:translateX(40px);opacity:0}}
  .toast .tibox{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .toast.ok .tibox{background:rgba(91,214,160,.16);color:var(--ok)}
  .toast.info .tibox{background:var(--tint);color:var(--primary)}
  .toast.err .tibox{background:rgba(242,132,158,.16);color:var(--err)}
  .toast .ttxt .tt{font-weight:700;font-size:13.5px;color:var(--tx)}
  .toast .ttxt .ts{font-size:12px;color:var(--tx2)}

  .empty{text-align:center;padding:70px 20px;color:var(--tx3)}
  .empty .ico{width:46px;height:46px;margin:0 auto 14px;stroke:var(--tx3)}
  .empty h4{color:var(--tx2);font-size:16px;font-weight:700;margin-bottom:6px}

  @media(max-width:760px){
    .sidebar{display:none}
    .main{padding:16px 16px 60px}
    .hero .inner{padding:26px}
    .explore-head h2{font-size:24px}

/* =====================================================================

/* ---------- Backend config (read from env/config, never hardcode) ----------
   Server-signed web API: the browser sends only identity headers
   (x-api-bundleid + x-api-email). The backend resolves the signing key by
   bundleId and signs server-side — so NO secret and NO proxy live in the
   browser. `window.CONFIG` is injected by config.js (gitignored, copy from
   config.example.js). When ported to Next.js, replace with NEXT_PUBLIC_* env
   vars (base url, bundle id, workflow ids — all client-safe).
*/
const CFG = (typeof window!=="undefined" && window.CONFIG) || {};
const USE_REAL_BACKEND = CFG.useRealBackend ?? false;
const BE = {
  base: CFG.beBase || "https://api-ai-genius.dev.aperogroup.ai",
  bundleId: CFG.bundleId || "",          // whitelisted by BE; resolves the signing key server-side
  // service id → workflowId on the workflow service (filled in config.js as BE sends them).
  workflows: CFG.workflows || { t2i: "3e01896a-fef2-4896-9a97-b68960d19170" }
};

/* ---------- Billing (Genius Pro subscription) — PRODUCTION-READY hook ----------
   Selling is live: subscribe() calls startCheckout(), which (when billing is
   configured) creates a provider-hosted Checkout session via BE and redirects.
   The browser only sends identity headers — the payment provider (Stripe/etc.)
   and its secret keys live on BE. To go live: set CONFIG.billing.useRealCheckout,
   the prices map, and stand up the two BE endpoints below. No client code change.
   With billing unconfigured it falls back to a local mock so the flow still demos. */

/* ---------- Seed community feed (placeholder for Nam's content) ---------- */

/* ---------- State (mock; localStorage) ---------- */

let S = load();
function load(){ try{ return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem("genius_web")||"{}")); }catch(e){ return {...DEFAULT_STATE}; } }
function save(){ localStorage.setItem("genius_web", JSON.stringify(S)); syncChrome(); }

/* ---------- Helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const uid = ()=>"g"+Math.floor(performance.now()*1000).toString(36)+Math.floor(performance.now()).toString(36);

function toast(kind,title,sub){
  const icons={ok:'<path d="M20 6 9 17l-5-5"/>',info:'<path d="M12 16v-5"/><circle cx="12" cy="8" r=".5" fill="currentColor"/>',err:'<path d="M18 6 6 18M6 6l12 12"/>'};

/* ---------- Sidebar / chrome sync ---------- */
function syncChrome(){
  const nc=$("#nav-count"); if(nc) nc.textContent = M0_SERVICES.length;
  $("#sb-plan").textContent = isPro() ? "👑 Genius Pro" : "Free plan";

/* =====================================================================
   AUTH — real Firebase (Google / Apple / Email) with mock fallback.
   Firebase web config is CLIENT-SAFE (protected by Authorized Domains +
   security rules), so it lives in config.js, NOT in server env.
   If config.firebase is absent/unfilled, falls back to mock so the file
   still runs offline. Console setup: see firebase-setup.md.
   ===================================================================== */
let pendingAfterAuth = null;
let FB = null;                                    // firebase.auth() instance, or null in mock mode
const FB_ENABLED = !!(window.firebase && CFG.firebase && CFG.firebase.apiKey);

function initAuth(){
  if(!FB_ENABLED){ console.info("[auth] mock mode — fill config.firebase to enable Firebase."); return; }
  firebase.initializeApp(CFG.firebase);
  FB = firebase.auth();
  // Single source of truth: Firebase drives S.user.
  FB.onAuthStateChanged(u=>{
    if(u){ S.user = { uid:u.uid, name:u.displayName || (u.email? u.email.split("@")[0] : "Creator"), email:u.email||"", photo:u.photoURL||"", provider:(u.providerData[0]&&u.providerData[0].providerId)||"firebase" }; }
    else { S.user = null; }
    save(); render();
    refreshSubscription();   // pull live Pro status for this user (no-op unless billing configured)
  });
}

// Already signed in → just return true; the caller continues. (Do NOT run `then`
// here — the caller IS the action, so running it would re-enter and recurse forever.)
// `then` is only the deferred resume, fired by afterAuth() once a fresh login completes.
function requireAuth(then){ if(S.user) return true; pendingAfterAuth=then; openAuth(); return false; }
function afterAuth(name){ closeAuth(); toast("ok","Welcome, "+(name||"creator").split(" ")[0]+"!","You're signed in."); const cb=pendingAfterAuth; pendingAfterAuth=null; render(); cb&&cb(); }
function authErr(e){ console.error(e); toast("err","Sign-in failed", (e&&e.message)||"Please try again."); }

function openAuth(){
  const m=el(`<div class="scrim-modal" id="authmodal">
    <div class="modal">
      <div class="mclose" onclick="closeAuth()"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></div>

      <h3>Sign in to Genius</h3>
      <p>Create AI images & videos right in your browser. Free to start.${FB_ENABLED?"":'<br><b style="color:var(--warn)">⚠ Demo mode</b> — Firebase not configured.'}</p>
      <div class="auth-btns" id="auth-providers">
        <button class="auth-btn" onclick="loginGoogle()"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-2 3.2-4.8 3.2-7.8z"/><path fill="#34A853" d="M12 23c2.9 0 5.4-1 7.2-2.6l-3.6-2.7c-1 .7-2.3 1-3.6 1-2.8 0-5.1-1.9-6-4.4H2.3v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M6 14.3a6.6 6.6 0 0 1 0-4.2V7.3H2.3a11 11 0 0 0 0 9.8L6 14.3z"/><path fill="#EA4335" d="M12 5.5c1.6 0 3 .5 4.1 1.6l3.1-3.1A11 11 0 0 0 2.3 7.3L6 10.1c.9-2.6 3.2-4.6 6-4.6z"/></svg> Continue with Google</button>
        <button class="auth-btn" onclick="loginApple()"><svg width="16" height="16" viewBox="0 0 384 512" fill="#fff"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM256.6 93c30.3-36 27.6-68.9 26.7-80.7-26.8 1.6-57.8 18.3-75.5 38.9-19.5 22.1-31 49.4-28.5 80.1 29 2.2 55.5-12.7 77.3-38.3z"/></svg> Continue with Apple</button>
        <button class="auth-btn" onclick="showEmailForm()"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Continue with Email</button>
      </div>
    </div></div>`);
  document.body.appendChild(m);
}
function closeAuth(){ const m=$("#authmodal"); if(m) m.remove(); }

function showEmailForm(){
  $("#auth-providers").innerHTML = `
    <input class="upload" style="min-height:auto;text-align:left" type="email" id="em" placeholder="you@email.com" autocomplete="email"/>
    <input class="upload" style="min-height:auto;text-align:left" type="password" id="pw" placeholder="Password (≥6 chars)" autocomplete="current-password"/>
    <button class="btn btn-primary btn-block" onclick="loginEmail()">Continue</button>
    <button class="auth-btn" onclick="openAuthBack()">← Other options</button>`;
  setTimeout(()=>{ const e=$("#em"); e&&e.focus(); },30);
}
function openAuthBack(){ closeAuth(); openAuth(); }

/* --- provider handlers (real Firebase, else mock) --- */
function loginGoogle(){
  if(!FB_ENABLED) return mockLogin("google");
  FB.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(r=>afterAuth(r.user.displayName)).catch(authErr);
}
function loginApple(){
  if(!FB_ENABLED) return mockLogin("apple");
  const p=new firebase.auth.OAuthProvider("apple.com"); p.addScope("email"); p.addScope("name");
  FB.signInWithPopup(p).then(r=>afterAuth(r.user.displayName||r.user.email)).catch(authErr);
}
function loginEmail(){
  const email=($("#em")||{}).value, pw=($("#pw")||{}).value;
  if(!email || !pw || pw.length<6){ toast("info","Check your details","Enter an email and a 6+ char password."); return; }
  if(!FB_ENABLED) return mockLogin("email", email);
  // Try sign-in; if no account, create one (prototype convenience).
  FB.signInWithEmailAndPassword(email,pw)
    .then(r=>afterAuth(r.user.email))
    .catch(e=>{
      if(e.code==="auth/user-not-found"){ FB.createUserWithEmailAndPassword(email,pw).then(r=>afterAuth(r.user.email)).catch(authErr); }
      else authErr(e);
    });
}

/* API trace — console only (no on-screen popup). Visible in DevTools for debugging. */
function apiLog(msg, kind){ try{ (kind==="err"?console.warn:console.debug)("[api]",msg); }catch(e){} }

/* =====================================================================
   BACKEND CALL — server-signed web API (the ONE place real wiring lives).
   Each mini-app maps to a workflowId (config.workflows[service.id]). Flow:
     1) POST /api/v1/web/execute  { workflowId, input }   -> { runId, jobId, status }
     2) poll GET /api/v1/web/:runId/status  every ~4s     -> until completed/failed/cancelled
   Web client only sends x-api-bundleid + x-api-email; BE signs & forwards.
   Falls back to a local mock when useRealBackend=false or the service has no
   workflowId yet — so the catalog still demos offline.
   ===================================================================== */
async function callBackend(service, input, onStatus){
  const workflowId = BE.workflows[service.id];
  // Fall back to the local mock unless real backend is on AND this service has a
  // workflowId AND a whitelisted bundleId is set. (bundleId pending from BE.)
  if(!USE_REAL_BACKEND || !workflowId || !BE.bundleId) return mockBackend(service, input, onStatus);
  const email = S.user && S.user.email;
  if(!email)                  return { ok:false, error:"Please sign in first." };

  const idHeaders = { "x-api-bundleid": BE.bundleId, "x-api-email": email };

  // 1) Execute — create the job.
  onStatus("queued","Queued — finding a GPU…");
  apiLog(`POST /web/execute  workflow=${workflowId.slice(0,8)}…  email=${email}`);
  let runId;
  try{
    const r = await fetch(`${BE.base}/api/v1/web/execute`, {
      method:"POST",
      headers:{ ...idHeaders, "Content-Type":"application/json" },
      body: JSON.stringify({ workflowId, input: buildInput(service, input) }),
    });
    const env = await r.json().catch(()=>({}));
    apiLog(`← execute HTTP ${r.status}` + (env.data&&env.data.runId?`  runId=${env.data.runId.slice(0,8)}…`:` ${env.message||""}`), r.ok?"ok":"err");
    if(!r.ok) return { ok:false, error: env.message || `Execute failed (HTTP ${r.status}).` };
    runId = (env.data||{}).runId;
    if(!runId) return { ok:false, error:"Backend returned no runId." };
  }catch(e){ apiLog(`✕ execute network error: ${(e&&e.message)||e}`,"err"); return { ok:false, error:"Network error: "+((e&&e.message)||e) }; }

  // 2) Poll status until terminal (completed / failed / cancelled).
  onStatus("running", service.async ? "Rendering video…" : "Generating…");
  const POLL_MS=4000, TIMEOUT_MS=(service.async?5*60:90)*1000, t0=performance.now();
  while(true){
    await wait(POLL_MS);
    try{
      const r = await fetch(`${BE.base}/api/v1/web/${encodeURIComponent(runId)}/status`, { headers:idHeaders });
      const env = await r.json().catch(()=>({}));
      if(r.ok){
        const d = env.data || {};
        apiLog(`← status: ${d.status}` + (d.error?`  — ${d.error}`:""), d.status==="failed"||d.status==="cancelled"?"err":"");
        if(d.status==="completed")                        return { ok:true,  output: parseOutput(service, d.output), runId, raw:d };
        if(d.status==="failed" || d.status==="cancelled") return { ok:false, error: d.error || `Generation ${d.status}.`, runId };
        // pending / processing → keep polling
      } else if(r.status!==404){   // a 404 right after execute can be a DB-write race; tolerate until timeout
        apiLog(`← status HTTP ${r.status}: ${env.message||""}`,"err");
        return { ok:false, error: env.message || `Status check failed (HTTP ${r.status}).`, runId };
      }
    }catch(e){ /* transient network blip — keep polling until timeout */ }
    if(performance.now()-t0 > TIMEOUT_MS) return { ok:false, error:"Timed out waiting for the result.", runId };
  }
}

/* MOCK PATH — offline behaviour when useRealBackend=false or workflowId missing. */
async function mockBackend(service, input, onStatus){
  await wait(500); onStatus("queued","Queued — finding a GPU…");
  await wait(900); onStatus("running", service.async ? "Rendering video…" : "Generating…");
  await wait(service.async ? 2600 : 1500);
  if(Math.random()<0.06) return { ok:false, error:"Engine timeout. Please try again." };
  return { ok:true, output: mockOutput(service, input) };
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
function mockOutput(service, input){
  // Reuse bundled assets so the prototype renders something real offline.
  if(service.modality.includes("Video")) return { type:"video", src: Math.random()<.5?"assets/wc.mp4":"assets/kid2.mp4" };
  const imgs=["assets/brazil.png","assets/japan.png","assets/netherlands.png"];
  return { type:"img", src: input.image || imgs[Math.floor(Math.random()*imgs.length)] };
}

/* Map the app's collected input → the workflow service input schema.
   `input` is forwarded verbatim by BE, so field names are WORKFLOW-SPECIFIC.
   Confirm each schema with BE per workflowId and add an override below as IDs arrive.
   ⚠ image inputs: CURRENT_INPUT.image is a local objectURL (URL.createObjectURL),
     which is NOT reachable by the server — i2i/i2v services need a real upload/host
     step (BE to advise) before their workflow can consume the image. */
function buildInput(service, raw){
  const PER_SERVICE = {
    // fal seedream/v4.5/text-to-image. Aspect ratio + image count come from the
    // dock controls (raw.ratio = fal imageSize enum, raw.count = number of images);
    // both default to the previous values so the call is always valid.
    t2i: () => ({
      prompt: raw.prompt,
      imageSize: raw.ratio || "square_hd",   // square_hd | portrait_16_9 | landscape_16_9
      numImages: raw.count || 1,
      max_images: raw.count || 1,
      seed: 0,
      syncMode: false,
      enableSafetyChecker: true,
    }),
    // i2v:             () => ({ positivePrompt: raw.prompt, image: raw.image, ratio:"16:9", resolution:"720p", duration:5, outputSound:false }),
    // "i2i-restyle":   () => ({ image: raw.image, style: raw.style }),
    // headshot:        () => ({ image: raw.image, style: raw.style }),
    // restore:         () => ({ image: raw.image }),
    // "living-portrait": () => ({ image: raw.image, positivePrompt: raw.prompt }),
    // jersey:          () => ({ image: raw.image, style: raw.style }),
    // makeup:          () => ({ image: raw.image, style: raw.style }),
  };
  if(PER_SERVICE[service.id]) return PER_SERVICE[service.id]();
  // Generic fallback: forward whatever we collected under best-guess keys.
  const out = {};
  if(raw.prompt) out.positivePrompt = raw.prompt;
  if(raw.style)  out.style = raw.style;
  if(raw.image)  out.image = raw.image;
  return out;
}

/* Map the workflow `output` object → the app's media shape {type, src}. */
function parseOutput(service, output){
  const o = output || {}, isVideo = service.modality.includes("Video");
  const src = o.resultFile        // seedream/v4.5/text-to-image (and other fal workflows)
    || o.videoUrl || o.imageUrl || o.url
    || (Array.isArray(o.images) && (o.images[0] && (o.images[0].url || o.images[0])))
    || (Array.isArray(o.output) && o.output[0])
    || (o.data && (o.data.resultFile || o.data.videoUrl || o.data.imageUrl || o.data.url))
    || "";
  return src ? { type:isVideo?"video":"img", src } : mockOutput(service, {});
}

/* OPTIONAL — server-backed job list (GET /api/v1/web/jobs). Use to hydrate the
   Gallery from the backend instead of localStorage. Returns { items,total,page,limit }
   or null. Note: cached ~120s server-side, sorted newest-first. */
async function fetchJobs(page=1, limit=20){
  if(!USE_REAL_BACKEND || !(S.user && S.user.email)) return null;
  apiLog(`GET /web/jobs?page=${page}&limit=${limit}  email=${S.user.email}`);
  try{
    const r = await fetch(`${BE.base}/api/v1/web/jobs?page=${page}&limit=${limit}`, { headers:{ "x-api-email": S.user.email } });
    const env = await r.json().catch(()=>({}));
    const d = r.ok ? (env.data || null) : null;
    apiLog(`← jobs HTTP ${r.status}` + (d?`  total=${d.total}, items=${(d.items||[]).length}`:`  ${env.message||""}`), r.ok?"ok":"err");
    return d;
  }catch(e){ apiLog(`✕ jobs network error: ${(e&&e.message)||e}`,"err"); return null; }
}

/* ---------- Generation orchestration ---------- */
function startGeneration(service, input){
  if(!requireAuth(()=>startGeneration(service,input))) return;
  // M0: generation is FREE for everyone — no credits, no gating. (Free-tier soft
  // limits / Pro perks come later; the upsell never blocks creation here.)
  const item={ id:uid(), svc:service.id, status:"processing", prompt:input.prompt||"", input, output:null, ts:Date.now() };
  S.gallery.unshift(item); save();
  toast("info", service.async?"Job queued":"Generating…", service.async?"We'll notify you when it's ready.":"");

  // Update the live service-page output if we're on it
  const onPage = ()=> location.hash===("#/app/"+service.id);
  callBackend(service, input, (st,label)=>{
    item.status = st==="queued"||st==="running" ? "processing" : item.status;
    if(onPage) renderJobState(label);
  }).then(res=>{
    if(res.ok){ item.status="success"; item.output=res.output; toast("ok","Your creation is ready ✦", service.name); if(onPage){ render(); } }
    else{ item.status="failed"; item.error=res.error; toast("err","Generation failed", res.error);
          if(onPage) renderJobError(res.error); }   // PERSISTENT error in the Result panel (doesn't vanish like a toast)
    GAL.page=1; GAL.fetchedPage=0;   // a new job exists → next Gallery view refetches page 1
    save();
    syncChrome();
  });
}
function renderJobState(label){
  const out=$("#svc-out"); if(!out) return;
  out.innerHTML = `<div class="job"><div class="spinner"></div><div class="status">${esc(label)}</div><div class="sub">Result will be saved to your Gallery</div></div>`;
}
function renderJobError(msg){
  const out=$("#svc-out"); if(!out) return;
  out.innerHTML = `<div class="job" style="color:var(--err)">
    <svg class="ico" viewBox="0 0 24 24" style="width:34px;height:34px"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg>
    <div class="status">Generation failed</div>
    <div class="sub" style="max-width:340px;text-align:center;white-space:normal">${esc(msg||"Unknown error")}</div></div>`;
}

function pickStyle(node,st){ document.querySelectorAll("#style-chips .chip-opt").forEach(c=>c.classList.remove("sel")); node.classList.add("sel"); CURRENT_INPUT.style=st; }
/* Dock control pills (aspect ratio / image count) — set CURRENT_INPUT[group] = val. */

/* Auto-grow the dock textarea up to its max-height. */
function autoGrow(el){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,140)+"px"; }
function runService(id){
  const s=svc(id);
  // Read the prompt straight from the DOM at click time — robust even if the
  // textarea was filled programmatically (e.g. from the Home quick-gen bar),
  // which doesn't fire `oninput` and would otherwise leave CURRENT_INPUT.prompt empty.
  const pEl=$("#in-prompt"); if(pEl) CURRENT_INPUT.prompt = pEl.value;
  if(s.input.includes("image") && !CURRENT_INPUT.image){ toast("info","Upload a photo first","This app needs an input image."); return; }
  if((s.input==="prompt"||s.input.includes("prompt")) && !(CURRENT_INPUT.prompt||"").trim()){ toast("info","Type a prompt first",""); return; }
  startGeneration(s, {...CURRENT_INPUT});
  renderJobState(s.async?"Queued — finding a GPU…":"Generating…");
  const oa=$("#out-actions"); if(oa) oa.style.display="none";
}
function showOutput(out){
  const box=$("#svc-out"); if(!box||!out) return;
  box.innerHTML = media(out);
  const a=$("#out-actions"); if(a) a.style.display="flex";
}

/* ---------- GALLERY ---------- */
/* ---------- Gallery pagination state (real-backend mode) ----------
   GAL.page/limit drive GET /web/jobs. We fetch ONLY the current page, once
   per page (guarded by fetchedPage) — no continuous polling. */
const GAL = { page:1, limit:12, total:0, items:[], loading:false, fetchedPage:0 };
function mapJob(it){
  const s = SERVICES.find(x=>BE.workflows[x.id]===it.workflowId) || svc("t2i");
  return {
    id: it.jobId, runId: it.runId, svc: s.id,
    status: it.status==="completed" ? "success" : (it.status==="failed"||it.status==="cancelled") ? "failed" : "processing",
    prompt: (it.input&&(it.input.prompt||it.input.positivePrompt))||"",
    input: it.input||{}, output: it.output ? parseOutput(s, it.output) : null,
    ts: it.createdAt ? Date.parse(it.createdAt) : 0,
  };
}
async function loadGalleryPage(page){
  GAL.loading=true; GAL.page=page;
  if(location.hash==="#/gallery") render();      // show loading state
  const res = await fetchJobs(page, GAL.limit);
  GAL.loading=false; GAL.fetchedPage=page;
  if(res && Array.isArray(res.items)){ GAL.total=res.total||0; GAL.items=res.items.map(mapJob); }
  if(location.hash==="#/gallery") render();       // guard below prevents a re-fetch loop
}
function gotoGalleryPage(p){
  const maxPage = Math.max(1, Math.ceil((GAL.total||0)/GAL.limit));
  p = Math.min(Math.max(1,p), maxPage);
  if(p===GAL.page && GAL.fetchedPage===p) return;
  GAL.fetchedPage=0;                              // force a fresh fetch for the new page
  loadGalleryPage(p);
}

function viewGallery(v){
  if(!S.user){ return emptyState(v,"Gallery","Sign in to see your creations","Your generated images and videos are saved here.",true); }
  const real = USE_REAL_BACKEND && BE.bundleId;

  if(real){
    // Fetch the current page exactly once (no continuous polling). render() re-runs
    // this function, but fetchedPage===page after the load short-circuits the refetch.
    if(!GAL.loading && GAL.fetchedPage!==GAL.page){ loadGalleryPage(GAL.page); }
    if(GAL.loading && !GAL.items.length){
      return v.innerHTML = `<div class="topbar"><div><h1>Gallery</h1><div class="sub">Loading…</div></div></div>
        <div class="gal-grid"><div class="proc-fill"><div class="spinner"></div></div></div>`;
    }
    if(!GAL.items.length){ return emptyState(v,"Gallery","Nothing here yet","Run a mini app and your results will show up here."); }
    const maxPage = Math.max(1, Math.ceil(GAL.total/GAL.limit));
    v.innerHTML = `
      <div class="topbar"><div><h1>Gallery</h1><div class="sub">${GAL.total} creation${GAL.total>1?'s':''} · page ${GAL.page}/${maxPage}</div></div>
        <div class="top-right"><button class="btn btn-primary" data-route="#/create">✦ Create</button></div></div>
      <div class="gal-grid">${GAL.items.map(galCard).join("")}</div>
      <div class="pager" style="display:flex;gap:10px;justify-content:center;align-items:center;margin:22px 0">
        <button class="btn btn-ghost btn-sm" ${GAL.page<=1||GAL.loading?'disabled':''} onclick="gotoGalleryPage(${GAL.page-1})">← Prev</button>
        <span class="sub" style="margin:0">${GAL.page} / ${maxPage}</span>
        <button class="btn btn-ghost btn-sm" ${GAL.page>=maxPage||GAL.loading?'disabled':''} onclick="gotoGalleryPage(${GAL.page+1})">Next →</button>
      </div>`;
    return;
  }

  // Mock / offline mode: local gallery, no pagination.
  if(!S.gallery.length){ return emptyState(v,"Gallery","Nothing here yet","Run a mini app and your results will show up here."); }
  v.innerHTML = `
    <div class="topbar"><div><h1>Gallery</h1><div class="sub">${S.gallery.length} creation${S.gallery.length>1?'s':''}</div></div>

}
function galCard(g){
  const s=svc(g.svc);
  const body = g.status==="success" ? media(g.output)
    : g.status==="processing" ? `${g.input&&g.input.image?`<img src="${g.input.image}" style="opacity:.4"/>`:""}<div class="proc-fill"><div class="spinner"></div></div>`
    : `<div class="proc-fill" style="flex-direction:column;gap:8px;color:var(--err)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg><span style="font-size:12px">Failed · refunded</span></div>`;
  const st = g.status;
  return `<div class="gal">${body}
    <span class="st ${st}">${st==='processing'?'<span class="pulse"></span>':''}${st[0].toUpperCase()+st.slice(1)}</span>
    <div class="gmeta">${s.emoji} ${esc(s.name)}</div></div>`;
}

function planCard(p){

function activityRow(a){

}
function logActivity(t,d,icon){ S.activity.unshift({t,d,icon:icon||"👑"}); }
function subscribe(id){ startCheckout(id); }

/* PRODUCTION-READY checkout. When billing is configured (CONFIG.billing.useRealCheckout
   + a whitelisted bundleId + signed-in user), POST to BE to create a provider-hosted
   Checkout session and redirect the browser to it. BE owns the payment provider + secret
   keys; the browser only sends identity headers. Unconfigured → local mock so it still demos. */
async function startCheckout(id){
  if(!requireAuth(()=>startCheckout(id))) return;
  const p = PLANS.find(x=>x.id===id); if(!p) return;

  if(BILLING.enabled && BE.bundleId && S.user && S.user.email){
    toast("info","Opening secure checkout…", p.nm);
    try{
      const r = await fetch(`${BE.base}${BILLING.createSessionPath}`, {
        method:"POST",
        headers:{ "x-api-bundleid":BE.bundleId, "x-api-email":S.user.email, "Content-Type":"application/json" },
        body: JSON.stringify({ planId:id, priceId: BILLING.prices[id] || undefined, successUrl: BILLING.successUrl, cancelUrl: BILLING.cancelUrl }),
      });
      const env = await r.json().catch(()=>({}));
      const url = (env.data && env.data.url) || env.url;
      if(r.ok && url){ window.location.href = url; return; }   // → provider-hosted checkout page
      toast("err","Couldn't start checkout", env.message || `HTTP ${r.status}`);
    }catch(e){ toast("err","Checkout error", (e&&e.message)||"Network error"); }
    return;
  }

  // MOCK PATH — billing not wired yet: flip locally so the subscribe flow demos end-to-end.
  S.plan="pro"; logActivity(p.nm+" subscription", "Started "+p.usd+"/"+p.per+(BILLING.enabled?"":" (demo — connect billing to charge)"),"👑");
  save(); render();
  toast("ok","Welcome to Genius Pro 👑","Unlimited unlocked."+(BILLING.enabled?"":" (Demo — wire billing to charge.)"));
}

/* Pull live subscription status from BE (after login or after returning from checkout). */
async function refreshSubscription(){
  if(!(BILLING.enabled && BE.bundleId && S.user && S.user.email)) return;
  try{
    const r = await fetch(`${BE.base}${BILLING.statusPath}`, { headers:{ "x-api-bundleid":BE.bundleId, "x-api-email":S.user.email } });
    const env = await r.json().catch(()=>({}));
    const d = env.data || env;
    if(r.ok && d && typeof d.active==="boolean"){ S.plan = d.active ? "pro" : "free"; save(); syncChrome(); }
  }catch(e){ /* non-fatal */ }
}

/* Handle the provider redirect back (?billing=success|cancel). */
function handleBillingReturn(){
  const q = new URLSearchParams(location.search);
  const b = q.get("billing");
  if(b==="success"){ toast("ok","Payment received 👑","Activating Genius Pro…"); refreshSubscription(); }
  else if(b==="cancel"){ toast("info","Checkout cancelled",""); }
  if(b){ try{ history.replaceState(null,"", location.pathname + location.hash); }catch(e){} }
}
function cancelPro(){ S.plan="free"; logActivity("Genius Pro cancelled","Back to Free plan","✕"); save(); render(); toast("info","Pro cancelled","You're back on the Free plan."); }
